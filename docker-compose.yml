services:
  api:
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./events:/events
      - ./config:/config
      - ./dashboard:/dashboard
    environment:
      - DATABASE_URL=sqlite:////data/store_intelligence.db
      - POS_CSV_PATH=/data/Brigade_Bangalore_10_April_26__1_bc6219c.csv
      - LOG_LEVEL=INFO
      - REENTRY_WINDOW_MINUTES=30
      - QUEUE_SPIKE_THRESHOLD=8
      - POS_CORRELATION_WINDOW_MINUTES=5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  pipeline:
    build: ./detection_pipeline
    profiles:
      - detection
    volumes:
      - ./clips:/clips:ro
      - ./events:/events
      - ./config:/config:ro
    environment:
      - API_URL=http://api:8000
      - CLIPS_DIR=/clips
      - EVENTS_DIR=/events
      - STORE_LAYOUT_PATH=/config/store_layout.json
    depends_on:
      - api